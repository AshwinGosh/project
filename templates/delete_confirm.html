<!DOCTYPE html>
<html>
<head>
    <title>Delete User</title>

    <style>

        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .delete-box{
            background: white;
            width: 400px;

            padding: 35px;
            border-radius: 12px;

            text-align: center;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.12);
        }

        h2{
            color: #1565c0;
            margin-bottom: 15px;
        }

        p{
            color: #444;
            margin-bottom: 25px;
        }

        .btn-group{
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .delete-btn{
            background: #e53935;
            color: white;

            padding: 12px 18px;
            border: none;
            border-radius: 6px;

            cursor: pointer;
            font-size: 15px;
        }

        .cancel-btn{
            background: #1565c0;
            color: white;

            padding: 12px 18px;
            border-radius: 6px;

            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="delete-box">

        <h2>Delete User</h2>

        <p>
            Are you sure you want to delete
            <strong>{{ user.name }}</strong> ?
        </p>

        <div class="btn-group">

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="delete-btn">
                    Yes, Delete
                </button>

            </form>

            <a href="{% url 'admin_panel' %}" class="cancel-btn">
                Cancel
            </a>

        </div>

    </div>

</body>
</html>
