<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .edit-box{
            width: 400px;
            background: white;

            padding: 35px;
            border-radius: 12px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.12);
        }

        h1{
            text-align: center;
            color: #1565c0;
            margin-bottom: 25px;
        }

        label{
            font-weight: bold;
            color: #333;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;

            border: 1px solid #b0c4de;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus{
            outline: none;
            border-color: #1565c0;
        }

        .btn-group{
            display: flex;
            gap: 10px;
        }

        .save-btn{
            flex: 1;
            background: #1565c0;
            color: white;

            padding: 12px;
            border: none;
            border-radius: 6px;

            font-size: 15px;
            cursor: pointer;
        }

        .save-btn:hover{
            background: #0d47a1;
        }

        .cancel-btn{
            flex: 1;
            background: #90a4ae;
            color: white;

            padding: 12px;
            border-radius: 6px;

            text-align: center;
            text-decoration: none;
        }

        .cancel-btn:hover{
            background: #78909c;
        }

    </style>
</head>

<body>

    <div class="edit-box">

        <h1>Edit User</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Name</label>
            <input type="text" name="name" value="{{ user.name }}">

            <label>Email</label>
            <input type="email" name="email" value="{{ user.email }}">

            <label>Phone</label>
            <input type="text" name="phone" value="{{ user.phone }}">

            <label>Password</label>
            <input type="text" name="password" value="{{ user.password }}">

            <div class="btn-group">

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

                <a href="{% url 'admin_panel' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>
</html>
