<!DOCTYPE html>
<html>
<head>
    <title>Delete User</title>
</head>
<body>

<h2>Delete User</h2>

<p>Are you sure you want to delete <strong>{{ user.user_name }}</strong>?</p>
<p>Email: {{ user.user_email }}</p>

<form method="POST">
    {% csrf_token %}
    <button style="background:red; color:white; padding:10px;">Yes, Delete</button>
    <a href="{% url 'admin_panel' %}" style="background:gray; color:white; padding:10px; text-decoration:none;">❌ Cancel</a>
</form>

</body>
</html>
