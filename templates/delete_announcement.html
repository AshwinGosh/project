<!DOCTYPE html>
<html>
<head>
    <title>Delete Announcement</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.12);
        }

        h2 {
            color: #1565c0;
        }

        p {
            color: #444;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #1565c0;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Delete Announcement</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ announcement.title }}</strong>?
    </p>

    <div class="btn-group">
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="delete-btn">Yes, Delete</button>
        </form>

        <a href="{% url 'admin_announcements' %}" class="cancel-btn">Cancel</a>
    </div>
</div>

</body>
</html>
