<!DOCTYPE html>
<html>
<head>
    <title>Edit Announcement</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 25px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #b0c4de;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #1565c0;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Edit Announcement</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="title" value="{{ announcement.title }}" required>

        <textarea name="message" required>{{ announcement.message }}</textarea>

        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'admin_announcements' %}" class="back">Cancel</a>
</div>

</body>
</html>
