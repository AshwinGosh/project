<!DOCTYPE html>
<html>
<head>
    <title>Announcements</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;
        }

        .header {
            background: #1565c0;
            color: white;
            padding: 20px 30px;
        }

        .container {
            width: 75%;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #1565c0;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #1565c0;
            margin-top: 0;
        }

        .date {
            color: gray;
            font-size: 14px;
        }

        .back {
            color: #1565c0;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Announcements</h2>
</div>

<div class="container">

    <a href="{% url 'house' %}" class="back">← Back to Home</a>

    <br><br>

    {% for announcement in announcements %}
        <div class="card">
            <h2>{{ announcement.title }}</h2>
            <p>{{ announcement.message }}</p>
            <p class="date">{{ announcement.date }}</p>
        </div>
    {% empty %}
        <div class="card">
            <h2>No Announcements</h2>
            <p>No announcements available right now.</p>
        </div>
    {% endfor %}

</div>

</body>
</html>
