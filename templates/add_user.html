<!DOCTYPE html>
<html>
<head>
    <title>Add User</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-box{
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.15);
        }

        h1{
            text-align: center;
            color: #1565c0;
            margin-bottom: 25px;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;

            border: 1px solid #b0c4de;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus{
            outline: none;
            border-color: #1565c0;
        }

        button{
            width: 100%;
            padding: 12px;

            background: #1565c0;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background: #0d47a1;
        }

    </style>
</head>

<body>

    <div class="form-box">

        <h1>Add User</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="name" placeholder="Enter Name">

            <input type="email" name="email" placeholder="Enter Email">

            <input type="text" name="phone" placeholder="Enter Phone">

            <input type="password" name="password" placeholder="Enter Password">

            <button type="submit">Add User</button>

        </form>

    </div>

</body>
</html>
