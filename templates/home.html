<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <style>
        .form-basin {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            font-size: 16px;
            background-color: #f9f9f9;
        }

        .form-basin form {
            margin: auto;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .form-basin label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-basin input,
        .form-basin textarea,
        .form-basin select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-basin input:focus,
        .form-basin textarea:focus,
        .form-basin select:focus {
            border-color: #007bff;
            outline: none;
        }

        .form-basin button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .form-basin button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="form-basin">
    <form method="POST">
        
        <!-- Django CSRF Token -->
        {% csrf_token %}

        <h2>Give Your Feedback</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>

        <label for="feedback">Feedback:</label>
        <textarea id="feedback" name="feedback" placeholder="Your Feedback" rows="5" required></textarea>

        <label for="satisfaction">Satisfaction Level:</label>
        <select id="satisfaction" name="satisfaction" required>
            <option value="">-- Select --</option>
            <option value="5">⭐⭐⭐⭐⭐ Very Satisfied</option>
            <option value="4">⭐⭐⭐⭐ Satisfied</option>
            <option value="3">⭐⭐⭐ Neutral</option>
            <option value="2">⭐⭐ Dissatisfied</option>
            <option value="1">⭐ Very Dissatisfied</option>
        </select>

        <button type="submit">Submit Feedback</button>

    </form>
</div>

</body>
</html>
