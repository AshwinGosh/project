<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eaf4ff;
        color: #222;
    }

    .top-header {
        background: #1565c0;
        color: white;
        padding: 20px 30px;
        box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    }

    .container {
        width: 80%;
        margin: 40px auto;
    }

    .add-btn {
        background: #1565c0;
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 20px;
        transition: 0.3s;
    }

    .add-btn:hover {
        background: #0d47a1;
    }

    .stats {
        background: white;
        padding: 18px;
        border-radius: 10px;
        margin-bottom: 25px;
        box-shadow: 0px 0px 15px rgba(0,0,0,0.08);
        border-left: 5px solid #1565c0;
    }

    .stats h3 {
        color: #1565c0;
        margin: 0;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0px 0px 15px rgba(0,0,0,0.08);
    }

    th {
        background: #1565c0;
        color: white;
        padding: 14px;
        text-align: left;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid #dbe7f3;
    }

    tr:hover {
        background: #f4f9ff;
    }

    .edit-btn {
        background: #1565c0;
        color: white;
        padding: 7px 12px;
        text-decoration: none;
        border-radius: 5px;
        margin-right: 5px;
    }

    .edit-btn:hover {
        background: #0d47a1;
    }

    .delete-btn {
        background: #e53935;
        color: white;
        padding: 7px 12px;
        text-decoration: none;
        border-radius: 5px;
    }

    .delete-btn:hover {
        background: #c62828;
    }

    </style>
</head>

<body>

    <div class="top-header">
        <h2>Admin Panel</h2>
    </div>

    <div class="container">

        <a href="{% url 'add_user' %}" class="add-btn">+ Add New User</a>
        <a href="{% url 'admin_announcements' %}" class="add-btn"> Announcements</a>

        <div class="stats">
            <h3>Total Registered Users: {{ total_users }}</h3>
        </div>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Password</th>
                <th>Actions</th>
            </tr>

            {% for user in users %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.phone }}</td>
                <td>{{ user.password }}</td>
                <td>
                    <a href="{% url 'edit_user' user.id %}" class="edit-btn">Edit</a>
                    <a href="{% url 'delete_user' user.id %}" class="delete-btn">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>

    </div>

</body>
</html>
