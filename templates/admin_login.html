<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background: #eaf4ff;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box{
            width: 350px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.12);
        }

        h1{
            text-align: center;
            color: #1565c0;
            margin-bottom: 30px;
        }

        input{
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #b0c4de;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus{
            outline: none;
            border-color: #1565c0;
        }

        button{
            width: 100%;

            padding: 12px;

            background: #1565c0;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover{
            background: #0d47a1;
        }

        .error{
            background: #ffebee;
            color: #c62828;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
